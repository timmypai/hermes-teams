name: Configuration CI
'on':
  push:
    branches: [main, 'zero-core-v3/**']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: configuration-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    uses: ./.github/workflows/reusable-ci.yml
    with:
      test-profile: python-stdlib-http-v1
  ci:
    name: ci
    needs: [tests]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require successful common CI
        shell: bash
        env:
          TEST_RESULT: ${{ needs.tests.result }}
        run: |
          set -euo pipefail
          test "$TEST_RESULT" = success
