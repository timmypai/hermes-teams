name: quality
# ub-mode "Then Make it Right" evidence: crapper (CRAP), dryer (duplication), mutator (mutation).
# Separate workflow on purpose: it is never part of the required `devflow-ci` check, and
# continue-on-error keeps a tool failure from marking the PR red. Results are evidence for the
# developer and reviewer (artifact devflow-quality-<sha> + run summary), not a merge gate.
# Third-party tools run only here (GitHub-hosted, read-only token, pinned commits), never in Hermes.
on:
  pull_request:
  push:
    branches-ignore: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: unclebob tools
        run: |
          for t in crapper:c757ec79a6c15dc815238bbd9c2f4601eb54d3cc \
                   dryer:66ff6d21a42c04afcad89c78a80066176d1294b0 \
                   mutator:830ec7e9c39664d753f8699015bc796df67727b9; do
            d="$RUNNER_TEMP/ub/${t%%:*}"
            git init -q "$d"
            git -C "$d" fetch -q --depth 1 "https://github.com/unclebob/${t%%:*}" "${t#*:}"
            git -C "$d" checkout -q FETCH_HEAD
            "$d/${t%%:*}" --help >/dev/null   # first run creates the tool's .venv
          done
      - name: quality
        env:
          UB_TOOLS: ${{ runner.temp }}/ub
          QUALITY_BASE: origin/${{ github.base_ref || github.event.repository.default_branch }}
        run: bash .devflow/quality.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devflow-quality-${{ github.sha }}
          path: .metrics
          if-no-files-found: ignore
          include-hidden-files: true
